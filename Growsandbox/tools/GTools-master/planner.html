<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Growtopia Tools | World Planner</title>
    <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="dist/css/adminlte.min.css" />
    <style>
        body { background:#1a1a1a; color:#ddd; font-family:sans-serif; margin:0; }
        #app { display:grid; grid-template-columns: 280px 1fr; height:100vh; }
        #sidebar { background:#222; padding:10px; overflow-y:auto; border-right:1px solid #333; }
        #sidebar h2 { font-size:14px; margin:8px 0 4px; color:#9cf; text-transform:uppercase; letter-spacing:.5px; }
        #sidebar select, #sidebar input { width:100%; box-sizing:border-box; padding:4px 6px; background:#111; color:#ddd; border:1px solid #333; border-radius:3px; }
        #stage { position:relative; overflow:auto; background:#0d0d0d; }
        #stage-inner { position:relative; }
        canvas.layer { position:absolute; left:0; top:0; image-rendering:pixelated; image-rendering:crisp-edges; }
        canvas#bg-canvas { z-index:1; }
        canvas#water-canvas { z-index:2; opacity:.8; }
        canvas#fg-canvas { z-index:3; }
        canvas#glue-canvas { z-index:4; opacity:.55; }
        canvas#grid-canvas { z-index:5; pointer-events:none; }
        canvas#cursor-canvas { z-index:6; pointer-events:none; }
        #toolbar { position:sticky; top:0; background:#1a1a1a; padding:8px; border-bottom:1px solid #333; z-index:10; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        #toolbar button { padding:4px 10px; background:#333; color:#ddd; border:1px solid #555; border-radius:3px; cursor:pointer; }
        #toolbar button.active { background:#06c; border-color:#08f; }
        #toolbar button:hover { background:#444; }
        #toolbar span.sep { width:1px; height:20px; background:#333; margin:0 4px; }
        #toolbar label { font-size:12px; color:#aaa; }
        #palette { display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; margin-top:8px; }
        .tile-btn { background:#111; border:1px solid #333; padding:4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:60px; }
        .tile-btn:hover { border-color:#08f; }
        .tile-btn.active { border-color:#0c6; background:#1a2a1a; }
        .tile-btn canvas { image-rendering:pixelated; }
        .tile-btn .name { font-size:9px; color:#999; text-align:center; max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        #info { font-size:11px; color:#888; padding:4px 8px; background:#0a0a0a; }
        #search { margin-bottom:6px; }
        #spreadFilter { margin-bottom:6px; }
        a.back { color:#9cf; text-decoration:none; font-size:12px; display:inline-block; margin-bottom:8px; }
    </style>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <a href="index.html" class="back">← Back to GTools</a>
            <h2>World Planner</h2>
            <div id="info">Loading data…</div>

            <h2>Search</h2>
            <input id="search" type="text" placeholder="filter by name…" />

            <h2>Spread Filter</h2>
            <select id="spreadFilter">
                <option value="all">All spreads</option>
                <option value="1">1 — Static</option>
                <option value="2">2 — Full 8-arah (water-style)</option>
                <option value="3">3 — Horizontal</option>
                <option value="5">5 — 4-arah (lava)</option>
                <option value="7">7 — Vertical</option>
                <option value="4">4 — Anti-same</option>
                <option value="6">6 — Random</option>
            </select>

            <h2>Tiles</h2>
            <div id="palette"></div>
        </aside>

        <main id="stage">
            <div id="toolbar">
                <label>Layer:</label>
                <button data-layer="fg" class="layer-btn active">FG</button>
                <button data-layer="bg" class="layer-btn">BG</button>
                <button data-layer="water" class="layer-btn">Water</button>
                <button data-layer="glue" class="layer-btn" title="Block Glue — placed tiles block neighbor connection">Glue</button>
                <span class="sep"></span>
                <label>Zoom:</label>
                <button id="zoomOut">−</button>
                <span id="zoomLabel">1×</span>
                <button id="zoomIn">+</button>
                <span class="sep"></span>
                <button id="clearLayer">Clear Layer</button>
                <button id="clearAll">Clear All</button>
                <span class="sep"></span>
                <label>Name:</label>
                <input id="worldName" type="text" value="world" style="width:90px;padding:3px 6px;background:#111;color:#ddd;border:1px solid #555;border-radius:3px;" />
                <button id="saveBtn" title="Download .gtworld">Save</button>
                <button id="loadBtn" title="Upload .gtworld">Load</button>
                <input id="loadFile" type="file" accept=".gtworld" style="display:none" />
                <button id="renderBtn" title="Export composite as PNG">Render PNG</button>
                <span class="sep"></span>
                <button id="rectBtn" title="Rectangle fill — click two corners to fill an area">Rect</button>
                <button id="cameraBtn" title="Pan mode — drag canvas to scroll instead of placing">Pan</button>
                <button id="countBtn" title="Tally all blocks for resource planning">Count</button>
                <select id="weatherSelect" title="Stage background weather" style="padding:3px 6px;background:#111;color:#ddd;border:1px solid #555;border-radius:3px;max-width:140px;">
                    <option value="">No weather</option>
                </select>
                <span class="sep"></span>
                <label>Paint:</label>
                <button class="paint-btn active" data-paint="" title="None" style="width:24px;">∅</button>
                <button class="paint-btn" data-paint="R" title="Red"      style="background:#ee6666;width:24px;">&nbsp;</button>
                <button class="paint-btn" data-paint="Y" title="Yellow"   style="background:#eeee66;width:24px;color:#000">&nbsp;</button>
                <button class="paint-btn" data-paint="G" title="Green"    style="background:#66ee66;width:24px;color:#000">&nbsp;</button>
                <button class="paint-btn" data-paint="A" title="Aqua"     style="background:#66eecc;width:24px;color:#000">&nbsp;</button>
                <button class="paint-btn" data-paint="B" title="Blue"     style="background:#6699ee;width:24px;">&nbsp;</button>
                <button class="paint-btn" data-paint="P" title="Purple"   style="background:#c466ee;width:24px;">&nbsp;</button>
                <button class="paint-btn" data-paint="C" title="Charcoal" style="background:#444;width:24px;">&nbsp;</button>
                <span class="sep"></span>
                <button id="flipToggle" title="Mirror tile horizontally">Flip</button>
                <span class="sep"></span>
                <span id="selected" style="color:#9cf;">No tile selected</span>
                <span class="sep"></span>
                <span id="cursor" style="color:#666;">—</span>
                <span class="sep"></span>
                <button id="debugToggle" title="Show auto-tile debug on hover">Debug</button>
            </div>
            <div id="debugBar" style="display:none;background:#0a0a0a;border-bottom:1px solid #333;padding:6px 10px;font-family:monospace;font-size:11px;color:#9cf;white-space:pre;">
hover a placed tile to inspect…
            </div>
            <div id="stage-inner">
                <canvas id="bg-canvas" class="layer"></canvas>
                <canvas id="water-canvas" class="layer"></canvas>
                <canvas id="fg-canvas" class="layer"></canvas>
                <canvas id="glue-canvas" class="layer"></canvas>
                <canvas id="grid-canvas" class="layer"></canvas>
                <canvas id="cursor-canvas" class="layer"></canvas>
            </div>
        </main>
    </div>
    <script src="assets/planner/planner_data.js"></script>
    <script src="dist/js/world_planner.js"></script>
</body>
</html>
